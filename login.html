<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — AUTORA Account</title>
  <meta name="description"
    content="Sign in to your AUTORA account. Note: Browsing, comparing, and purchasing operate account-free for demo testing.">
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>

<body>
  <main class="auth-page">
    <div class="auth-card">
      <a class="logo" href="index.html">
        <img src="assets/images/logo.png" alt="AUTORA Logo" class="logo-img">
        AUTORA
      </a>

      <div class="eyebrow" style="justify-content:center;margin-bottom:6px">AUTORA ACCOUNT</div>
      <h1>SIGN IN</h1>

      <div class="auth-notice">
        Account authentication is reserved for a future release. Browsing, shortlisting, comparing, and vehicle purchase
        requests operate <strong>account-free</strong>.
      </div>

      <div class="social-icon-row">
        <button type="button" class="btn-social-icon" title="Continue with Google" onclick="handleSocialAuth('Google')">
          <svg width="20" height="20" viewBox="0 0 24 24">

              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />

            <path fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
            <path fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
          </svg>
        </button>
        <button type="button" class="btn-social-icon" title="Continue with Apple" onclick="handleSocialAuth('Apple')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.66-.81 1.11-1.93.99-3.05-.96.04-2.12.64-2.8 1.44-.61.71-1.15 1.86-1 2.97 1.07.08 2.16-.54 2.81-1.36z" />
          </svg>
        </button>
        <button type="button" class="btn-social-icon" title="Facebook" onclick="handleSocialAuth('Facebook')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2">
            <path
              d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
          </svg>
        </button>
        <button type="button" class="btn-social-icon" title="Instagram" onclick="handleSocialAuth('Instagram')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#E4405F">
            <path
              d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z" />
          </svg>
        </button>
        <button type="button" class="btn-social-icon" title="Twitter / X" onclick="handleSocialAuth('Twitter')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" />
          </svg>
        </button>
        <button type="button" class="btn-social-icon" title="YouTube" onclick="handleSocialAuth('YouTube')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#FF0000">
            <path
              d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
          </svg>
        </button>
        <button type="button" class="btn-social-icon" title="LinkedIn" onclick="handleSocialAuth('LinkedIn')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#0A66C2">
            <path
              d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1-2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z" />
          </svg>
        </button>
      </div>

      <div class="social-divider">
        <span>OR EMAIL SIGN IN</span>
      </div>

      <form
        onsubmit="event.preventDefault(); alert('Demo Sign In complete. You can browse, compare, and request vehicle purchases without an account.'); location.href='vehicles.html';">
        <div class="form-group" style="margin-bottom:16px">
          <label>Email Address</label>
          <input type="email" placeholder="name@domain.com" required value="demo.user@autora.example">
        </div>

        <div class="form-group" style="margin-bottom:24px">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <label>Password</label>
            <a href="#" onclick="alert('Password reset link sent! Please check your email inbox.'); return false;"
              style="font-family:var(--font-mono);font-size:11px;color:var(--red);text-decoration:none;font-weight:600">Forgot
              Password?</a>
          </div>
          <input type="password" placeholder="••••••••" required value="password123">
        </div>

        <button type="submit" class="btn primary" style="width:100%">Sign In →</button>
      </form>

      <div style="text-align:center;font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:24px">
        New to AUTORA? <a href="signup.html" style="color:var(--red);font-weight:600">Create an Account</a>

      </div>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>

</html>
